
name: Build IY9-6 LagFix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip -q IY9-6-LagFix-Source.zip

      - name: Build APK
        working-directory: IY9-6-LagFix
        run: |
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: IY9-6-LagFix-APK
          path: IY9-6-LagFix/build/app/outputs/flutter-apk/app-release.apk
